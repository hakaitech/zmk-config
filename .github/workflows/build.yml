name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "build.yaml"
      - "scripts/lint-keymap.sh"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keymap guard rails (no transparent keys, 42 bindings/layer, GAME has no layer keys)
        run: sh scripts/lint-keymap.sh

  build:
    needs: lint
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
